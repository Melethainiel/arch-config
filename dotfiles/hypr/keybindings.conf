###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, L, exec, pidof hyprlock >/dev/null 2>&1 || hyprlock
bind = $mainMod SHIFT, F, exec, $fileManager
bind = $mainMod, T, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = ALT, F11, fullscreen, 1
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod ALT, SPACE, exec, $HOME/.local/bin/arch-menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod SHIFT, N, exec, code
bind = $mainMod SHIFT, A, exec, $terminal --class=com.mitchellh.ghostty.wiremix -e wiremix
bind = $mainMod SHIFT, O, exec, obsidian
bind = $mainMod SHIFT, P, exec, bitwarden
bind = $mainMod SHIFT, T, exec, $terminal -e btop
bind = $mainMod SHIFT, D, exec, $terminal -e lazydocker
bind = $mainMod SHIFT, W, exec, $terminal --class=com.mitchellh.ghostty.impala -e impala
bind = $mainMod SHIFT, B, exec, brave

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d
bind = ALT, TAB, cyclenext,
bind = ALT SHIFT, TAB, cyclenext, prev
bind = ALT, TAB, bringactivetotop,
bind = ALT SHIFT, TAB, bringactivetotop,

# Switch workspaces with the physical number row so this works on FR/AZERTY too
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10
bind = $mainMod, TAB, workspace, e+1
bind = $mainMod SHIFT, TAB, workspace, e-1
bind = $mainMod CTRL, TAB, workspace, previous

# Move active window to a workspace with mainMod + SHIFT + number row
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Screenshots with hyprshot
bind = , PRINT, exec, hyprshot -m output
bind = SHIFT, PRINT, exec, hyprshot -m region
bind = $mainMod, PRINT, exec, hyprshot -m window
bind = $mainMod SHIFT, PRINT, exec, mkdir -p "$HOME/Pictures/Screenshots" && grim -g "$(slurp -o -r -c '##ff0000ff')" -t ppm - | satty --filename - --fullscreen --output-filename "$HOME/Pictures/Screenshots/satty-$(date +%Y%m%d-%H%M%S).png"
bind = ALT, PRINT, exec, mkdir -p "$HOME/Videos/Recordings" && wf-recorder -g "$(slurp)" -f "$HOME/Videos/Recordings/recording-$(date +%Y%m%d-%H%M%S).mkv"
bind = ALT SHIFT, PRINT, exec, pkill -INT wf-recorder

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindel = SHIFT, XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 100%
bindel = SHIFT, XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 1%
bindel = ALT, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bindel = ALT, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = ALT, XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 1%+
bindel = ALT, XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 1%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
