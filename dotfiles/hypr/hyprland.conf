# Main entrypoint. Split configuration lives next to this file.
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/config.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/keybindings.conf

# HyprMod managed settings. Keep this last so generated overrides still win.
source = ~/.config/hypr/hyprland-gui.conf

# Wallpaper/theme colors generated by matugen. Keep after HyprMod so the active theme wins.
source = ~/.config/hypr/theme.conf
